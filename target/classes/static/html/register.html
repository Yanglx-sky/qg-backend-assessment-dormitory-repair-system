<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍报修系统 - 注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .register-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .login-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .login-link a:hover {
            color: #00f2fe;
            text-decoration: underline;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .register-container {
                padding: 30px;
                margin: 0 20px;
            }
            
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>注册账号</h1>
        <div class="message" id="message" style="display: none;"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="account">账号</label>
                <input type="text" id="account" name="account" required placeholder="请输入以3或2开头的数字账号">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="请确认密码">
            </div>
            <div class="form-group">
                <label for="userName">姓名</label>
                <input type="text" id="userName" name="userName" required placeholder="请输入姓名">
            </div>
            <button type="submit" id="register-btn">
                <span id="btn-text">注册</span>
                <span id="loading" class="loading" style="display: none;"></span>
            </button>
            <div class="login-link">
                已有账号？<a href="login.html">登录</a>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const userName = document.getElementById('userName').value;
            const messageDiv = document.getElementById('message');
            const registerBtn = document.getElementById('register-btn');
            const btnText = document.getElementById('btn-text');
            const loading = document.getElementById('loading');
            
            // 清空错误信息
            messageDiv.style.display = 'none';
            
            // 验证账号格式：只能以3或2开头的数字，不能是admin
            if (account === 'admin') {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'admin账号不能注册';
                messageDiv.style.display = 'block';
                return;
            }
            
            // 验证账号格式：只能以3或2开头的数字
            const accountRegex = /^[23]\d+$/;
            if (!accountRegex.test(account)) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '账号格式错误，只能以3或2开头的数字';
                messageDiv.style.display = 'block';
                return;
            }
            
            // 验证密码是否一致
            if (password !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '两次输入的密码不一致';
                messageDiv.style.display = 'block';
                return;
            }
            
            // 显示加载状态
            btnText.style.display = 'none';
            loading.style.display = 'inline-block';
            registerBtn.disabled = true;
            
            // 构建用户对象
            const user = {
                account: account,
                password: password,
                userName: userName
            };
            
            // 发送注册请求
            fetch('/user/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                // 恢复按钮状态
                btnText.style.display = 'block';
                loading.style.display = 'none';
                registerBtn.disabled = false;
                
                if (data.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '注册成功！即将跳转到登录页面...';
                    messageDiv.style.display = 'block';
                    
                    // 3秒后跳转到登录页面
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message;
                    messageDiv.style.display = 'block';
                }
            })
            .catch(error => {
                // 恢复按钮状态
                btnText.style.display = 'block';
                loading.style.display = 'none';
                registerBtn.disabled = false;
                
                messageDiv.className = 'message error';
                messageDiv.textContent = '注册失败，请稍后重试';
                messageDiv.style.display = 'block';
                console.error('注册失败:', error);
            });
        });
    </script>
</body>
</html>
